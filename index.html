<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau Embedded Dashboard</title>
    <script src="https://cdn.auth0.com/js/auth0/9.19/auth0.min.js"></script>
</head>
<body>
    <h2>Tableau Embedded Dashboard</h2>
    
    <button id="login" onclick="login()">Login</button>
    <button id="logout" onclick="logout()" style="display:none;">Logout</button>

    <div id="dashboard-container" style="display:none;">
        <iframe id="tableau-dashboard" 
            src="https://10ay.online.tableau.com/t/forsightanalytics-c7b8da01a7/views/EmailPerformancebyCampaign/EmailPerformancebyCampaign?:embed=y&:showVizHome=no&:tabs=no" 
            width="800" height="600">
        </iframe>
    </div>

    <script>
        const auth0Client = new auth0.WebAuth({
            domain: "dev-ltdreu8c7zz8icui.us.auth0.com",
            clientID: "ebOp2pntCCrNRMn6xLPqEjQaEK4dJblU",
            redirectUri: "https://kofiokine.github.io/Projects/", // ✅ FIXED
            responseType: "token id_token",
            scope: "openid profile email"
        });

        function login() {
            console.log("Login button clicked!");
            auth0Client.authorize();
        }

        function logout() {
            console.log("Logging out...");
            auth0Client.logout({
                returnTo: "https://kofiokine.github.io/Projects/"
            });
        }

        function handleAuthCallback() {
            auth0Client.parseHash((err, authResult) => {
                if (authResult && authResult.idToken) {
                    console.log("User authenticated:", authResult);
                    localStorage.setItem("id_token", authResult.idToken);
                    document.getElementById("login").style.display = "none";
                    document.getElementById("logout").style.display = "block";
                    document.getElementById("dashboard-container").style.display = "block";
                } else if (err) {
                    console.error("Error:", err);
                }
            });
        }

        window.onload = function () {
            console.log("Checking for Auth Callback...");
            if (window.location.hash.includes("id_token")) {
                handleAuthCallback();
            }
        };
    </script>
</body>
</html>
