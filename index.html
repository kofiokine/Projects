<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau Embedded Dashboard with Auth0</title>
    <script src="https://cdn.auth0.com/js/auth0-spa-js/2/auth0-spa-js.production.js"></script>
</head>
<body>
    <h2>Tableau Embedded Dashboard</h2>

    <div id="content"></div>

    <script>
      let auth0Client = null;

      const configureClient = async () => {
        auth0Client = await createAuth0Client({
          domain: "YOUR_AUTH0_DOMAIN",
          clientId: "YOUR_AUTH0_CLIENT_ID",
          authorizationParams: {
            redirect_uri: "https://kofiokine.github.io/Projects/"
          }
        });
      };

      const processLoginState = async () => {
        const isAuthenticated = await auth0Client.isAuthenticated();

        if (isAuthenticated) {
          document.getElementById("dashboard").style.display = "block";
        } else {
          await auth0Client.loginWithRedirect();
        }
      };

      window.onload = async () => {
        await configureClient();

        if (window.location.search.includes("code=") && window.location.search.includes("state=")) {
          await auth0Client.handleRedirectCallback();
          window.history.replaceState({}, document.title, "/Projects/");
        }

        await processAuth();
      };

      const processAuthState = async () => {
        const isAuthenticated = await auth0Client.isAuthenticated();

        if (isAuthenticated) {
          document.getElementById("tableauFrame").style.display = "block";
        } else {
          await auth0Client.loginWithRedirect();
        }
      };

      configureClient().then(processAuthState);

    </script>
</head>
<body>

<h2>Tableau Embedded Dashboard</h2>

<div id="tableauFrame" style="display:none;">
    <iframe src="YOUR_TABLEAU_DASHBOARD_URL?:embed=yes" width="100%" height="800px"></iframe>
</div>

</body>
</html>
