<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau Embedded Dashboard</title>
    <script src="https://cdn.auth0.com/js/auth0/9.19/auth0.min.js"></script>
</head>
<body>
    <h2>Tableau Embedded Dashboard</h2>
    
    <button id="login-btn">Login with SSO</button>
    <p id="welcome"></p>
    <div id="tableau-container" style="display:none;">
        <iframe id="tableau-iframe" 
                src="https://10ay.online.tableau.com/t/forsightanalytics-c7b8da01a7/views/EmailPerformancebyCampaign/EmailPerformancebyCampaign?:embed=y&:showVizHome=no&:tabs=no" 
                width="800" 
                height="600">
        </iframe>
    </div>

    <script>
        const auth0Client = new auth0.WebAuth({
            domain: "dev-ltdreu8c7zz8icui.us.auth0.com",
            clientID: "ebOp2pntCCrNRMn6xLPqEjQaEK4dJblU",
            redirectUri: "https://kofiokine.github.io/Projects/callback",
            responseType: "token id_token",
            scope: "openid profile email",
            audience: "47020635-fb8d-4f18-8a48-7e8741557511"
        });

        document.getElementById('login-btn').onclick = function() {
            auth0Client.authorize();
        };

        function handleAuthentication() {
            auth0Client.parseHash((err, authResult) => {
                if (authResult && authResult.accessToken && authResult.idToken) {
                    auth0Client.userInfo(authResult.accessToken, function(err, user) {
                        if (!err) {
                            document.getElementById("login-btn").style.display = "none";
                            document.getElementById("welcome").innerHTML = `Welcome, ${user.name}!`;
                            document.getElementById("tableau-container").style.display = "block";
                        } else {
                            console.log(err);
                        }
                    });
                } else if (err) {
                    console.log(err);
                }
            });
        }

        window.onload = handleAuthentication;
    </script>
</body>
</html>
