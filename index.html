<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau Dashboard with Auth0</title>
    <!-- Use the correct Auth0 SPA SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@auth0/auth0-spa-js@2/dist/auth0-spa-js.production.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const auth0Client = await createAuth0Client({
                domain: "dev-ltdreu8c7zz8icui.us.auth0.com",
                clientId: "YpejSZ0X3CvSIkxOQIDHMa2HQ1rpaUdy",
                authorizationParams: {
                    redirect_uri: "https://kofiokine.github.io/Projects/"
                }
            });

            async function checkAuth() {
                const isAuthenticated = await auth0Client.isAuthenticated();
                console.log("Auth Status:", isAuthenticated);

                if (isAuthenticated) {
                    const user = await auth0Client.getUser();
                    console.log("Logged-in User:", user);
                    
                    document.getElementById("login").style.display = "none";
                    document.getElementById("logout").style.display = "block";
                    document.getElementById("tableau-frame").style.display = "block";
                } else {
                    document.getElementById("login").style.display = "block";
                    document.getElementById("logout").style.display = "none";
                    document.getElementById("tableau-frame").style.display = "none";
                }
            }

            document.getElementById("login").addEventListener("click", async function () {
                console.log("Login button clicked!");
                await auth0Client.loginWithRedirect();
            });

            document.getElementById("logout").addEventListener("click", async function () {
                console.log("Logging out...");
                await auth0Client.logout({
                    logoutParams: { returnTo: "https://kofiokine.github.io/Projects/" }
                });
            });

            checkAuth();
        });
    </script>
</head>
<body>
    <h2>Tableau Dashboard (Auth Protected)</h2>
    <button id="login">Login</button>
    <button id="logout" style="display: none;">Logout</button>

    <div id="tableau-frame" style="display: none;">
        <iframe src="https://10ay.online.tableau.com/t/forsightanalytics-c7b8da01a7/views/EmailPerformancebyCampaign/EmailPerformancebyCampaign?:embed=y&:showVizHome=no&:tabs=no" 
            width="1000" height="700">
        </iframe>
    </div>
</body>
</html>
