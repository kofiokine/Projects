<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau Dashboard with Auth0</title>
    <script src="https://cdn.auth0.com/js/auth0/9.20/auth0.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const auth0Client = await auth0.createAuth0Client({
                domain: "dev-ltdreu8c7zz8icui.us.auth0.com",
                client_id: "YpejSZ0X3CvSIkxOQIDHMa2HQ1rpaUdy",
                redirect_uri: "https://kofiokine.github.io/Projects/"
            });

            async function checkAuth() {
                const isAuthenticated = await auth0Client.isAuthenticated();
                if (isAuthenticated) {
                    document.getElementById("login").style.display = "none";
                    document.getElementById("logout").style.display = "block";
                    document.getElementById("tableau-frame").style.display = "block";
                } else {
                    document.getElementById("login").style.display = "block";
                    document.getElementById("logout").style.display = "none";
                    document.getElementById("tableau-frame").style.display = "none";
                }
            }

            document.getElementById("login").addEventListener("click", async function () {
                await auth0Client.loginWithRedirect();
            });

            document.getElementById("logout").addEventListener("click", async function () {
                await auth0Client.logout({
                    returnTo: "https://kofiokine.github.io/Projects/"
                });
            });

            checkAuth();
        });
    </script>
</head>
<body>
    <h2>Tableau Dashboard (Auth Protected)</h2>
    <button id="login">Login</button>
    <button id="logout" style="display: none;">Logout</button>

    <div id="tableau-frame" style="display: none;">
        <iframe src="https://10ay.online.tableau.com/t/forsightanalytics-c7b8da01a7/views/EmailPerformancebyCampaign/EmailPerformancebyCampaign?:embed=y&:showVizHome=no&:tabs=no" width="1000" height="700"></iframe>
    </div>
</body>
</html>
